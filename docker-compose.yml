version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: docshield-backend
    restart: always
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/app/data/docshield.db
      - CLIENT_URL=${CLIENT_URL}
      - NODE_ENV=production
    volumes:
      - db_data:/app/data
    networks:
      - docshield_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: docshield-frontend
    restart: always
    networks:
      - docshield_network

  nginx:
    image: nginx:alpine
    container_name: docshield-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - docshield_network

volumes:
  db_data:

networks:
  docshield_network:
    driver: bridge
